<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Surprise Box</title>
<style>
  :root{--bg:#fff8f0;--box:#f6c5b8;--ribbon:#d9534f}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#ffeede);font-family:Arial,Helvetica,sans-serif}
  .stage{width:320px;text-align:center}
  .box{width:100%;height:220px;background:var(--box);border-radius:12px;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.15);overflow:hidden;cursor:pointer;transition:transform .4s}
  .lid{position:absolute;left:0;right:0;top:-40px;height:80px;background:var(--box);border-bottom:6px solid rgba(0,0,0,.03);border-radius:12px 12px 0 0;transform-origin:center bottom;transition:transform .6s}
  .ribbon{position:absolute;left:50%;top:40px;transform:translateX(-50%);height:20px;width:260px;background:var(--ribbon);border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .bow{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:44px;height:44px;background:var(--ribbon);border-radius:50%;}
  .content{padding:24px;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
  .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:6px solid #fff;margin:12px auto;display:block;box-shadow:0 6px 18px rgba(0,0,0,.15)}
  h1{font-size:20px;margin:8px 0;color:#6b2b1f}
  p.small{font-size:13px;color:#5b3b36;margin:4px 0 0}
  .open .lid{transform:rotateX(75deg) translateY(-10px);box-shadow:0 -8px 30px rgba(0,0,0,.12)}
  .open .content{opacity:1;transform:none}
  .hint{font-size:13px;color:#7a5a53;margin-top:10px}
  .credit{font-size:11px;color:#8a6b63;margin-top:8px}
</style>
</head>
<body>
  <div class="stage">
    <div id="box" class="box" title="Click to open">
      <div class="lid"></div>
      <div class="ribbon"></div>
      <div class="bow"></div>
      <div class="content" id="content">
        <img id="photo" class="photo" src="" alt="Photo"/>
        <h1 id="name">Happy Rakshabandhan!</h1>
        <p class="small" id="msg">Tumhari chhoti si surprise — bahut pyaar ke saath.</p>
        <div class="credit">Share this link on WhatsApp: add name & photo in the URL</div>
      </div>
    </div>
    <div class="hint">Click the box to open</div>
  </div>

<script>
  // Read query params: ?name=Anshu&photo=https://...
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || '';
  const photo = params.get('photo') || '';

  const nameEl = document.getElementById('name');
  const photoEl = document.getElementById('photo');

  if (name) nameEl.textContent = name;
  if (photo) {
    photoEl.src = photo;
    photoEl.onerror = ()=>{ photoEl.src = placeholder(); }
  } else {
    photoEl.src = placeholder();
  }

  const box = document.getElementById('box');
  box.addEventListener('click', ()=>{
    box.classList.toggle('open');
  });

  function placeholder(){
    return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect rx="60" width="120" height="120" fill="%23ffd6c3"/><circle cx="60" cy="46" r="26" fill="%23fff"/><rect x="20" y="86" width="80" height="22" rx="11" fill="%23fff"/></svg>';
  }

  // Optional: open automatically after 700ms for effect
  setTimeout(()=> box.classList.add('open'), 700);
</script>
</body>
</html>
